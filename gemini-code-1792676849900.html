<!-- Fester Chat-Footer am unteren Bildschirmrand -->
<div class="chat-footer">
    <div class="chat-container">
        <!-- Kamera / Bild-Upload Button -->
        <label for="image-input" class="chat-btn icon-btn" title="Foto vom Essen hochladen">
            📷
            <input type="file" id="image-input" accept="image/*" hidden>
        </label>

        <!-- Audio / Spracheingabe Button -->
        <button type="button" class="chat-btn icon-btn" id="mic-btn" title="Sprachnachricht aufnehmen">
            🎤
        </button>

        <!-- Textfeld für die Beschreibung (z.B. "2 Brötchen mit Nutella") -->
        <input type="text" id="chat-input" placeholder="Essen beschreiben (z.B. Haferflocken Shake)..." autocomplete="off">

        <!-- Absende-Button -->
        <button type="button" class="chat-btn send-btn" id="send-btn">➤</button>
    </div>
</div>
